# Everything except hosts and the API endpoint. `mise run apply` merges those in from the nodes output
# and writes the result to .state/kubeone.yaml.
apiVersion: kubeone.k8c.io/v1beta2
kind: KubeOneCluster
name: homelab

versions:
  kubernetes: "v1.35.0"

# No cloud controller: libvirt has none, and Cilium L2 announcements cover LoadBalancer services.
cloudProvider:
  none: {}

clusterNetwork:
  # Must not overlap the libvirt network (10.5.0.0/24).
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

  # Cilium owns service routing, so kube-proxy is never installed.
  kubeProxy:
    skipInstallation: true

  cni:
    cilium:
      kubeProxyReplacement: true
      # Gateway API also needs its CRDs on the cluster; `mise run cluster:post-install` applies them.
      enableGatewayAPI: true
      enableHubble: true
      # Lets Cilium answer ARP for LoadBalancer IPs on the libvirt bridge, reachable straight from the host.
      enableL2Announcements: true
