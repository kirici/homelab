[tools]
opentofu = "latest"
terragrunt = "latest"
# KubeOne 1.14 is the first release with the Cilium Gateway API switch and supports Kubernetes 1.34-1.36.
"github:kubermatic/kubeone" = "1.14"
kubectl = "latest"
helm = "latest"
cilium-cli = "latest"
jq = "latest"

[env]
LIBVIRT_DEFAULT_URI = "qemu:///system"
# One shared provider download instead of one per unit; five units would otherwise fetch the same providers repeatedly.
TG_PROVIDER_CACHE = "1"
TG_TF_PATH = "tofu"
# Read by live/homelab/cluster.hcl. Override per machine without touching the repo.
K8S_SSH_KEY = "{{ env.HOME }}/.ssh/id_ed25519"
K8S_SSH_PUBKEY = "{{ env.HOME }}/.ssh/id_ed25519.pub"
# Kept inside the repo so a stray `kubectl` in another shell never talks to this cluster by accident.
KUBECONFIG = "{{ config_root }}/.state/kubeconfig"

[tasks.plan]
description = "Plan all infra units"
run = "terragrunt run --all plan --working-dir live/homelab"

[tasks.apply]
description = "Create network, image, VMs and the generated KubeOne manifest (no Kubernetes yet)"
run = "terragrunt run --all apply --working-dir live/homelab"

[tasks.destroy]
description = "Tear down all VMs, networks and the pool"
run = "terragrunt run --all destroy --working-dir live/homelab"

# Multi-line scripts use '''...''' (literal strings): in a """...""" string a trailing backslash is TOML's
# line-continuation and would glue the shell lines together.
[tasks."nodes:wait"]
description = "Block until every node answers on SSH"
shell = "bash -c"
run = '''
for ip in $(terragrunt output -json --working-dir live/homelab/nodes nodes | jq -r 'values[].ip'); do
  echo "waiting for $ip"
  until timeout 2 bash -c "</dev/tcp/$ip/22" 2>/dev/null; do sleep 2; done
done
'''

[tasks."cluster:apply"]
description = "Install or reconcile Kubernetes with KubeOne using the manifest generated by `apply`"
depends = ["nodes:wait"]
shell = "bash -c"
run = '''
kubeone apply \
  --manifest .state/kubeone.yaml \
  --auto-approve \
  --verbose \
  && kubeone kubeconfig \
    --manifest .state/kubeone.yaml \
    > .state/kubeconfig
'''

[tasks."cluster:post-install"]
description = "Gateway API CRDs, then LB IP pool and L2 announcements"
shell = "bash -c"
run = '''
kubectl apply --server-side \
  --filename https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml \
  && kubectl --namespace kube-system rollout restart deployment/cilium-operator \
  && kubectl --namespace kube-system rollout status deployment/cilium-operator \
  && kubectl apply --filename kubeone/manifests/cilium-lb-ipam.yaml
'''
